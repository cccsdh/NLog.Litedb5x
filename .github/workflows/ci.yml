name: CI - build, test, pack and publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (8 + 10)
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ./src/Master.sln

      - name: Build
        run: dotnet build ./src/Master.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./src/Master.sln --configuration Release --no-build --verbosity normal

      - name: Set package version
        id: set_version
        run: |
          DATE=$(date -u +%Y.%m.%d)
          VERSION="${DATE}.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Package version: $VERSION"

      # Pack .NET 8 version
      - name: Pack NLog.LiteDB5x (.NET 8)
        run: dotnet pack ./src/NLog.LiteDB5x/NLog.LiteDB5x.csproj \
              --configuration Release \
              --output ./artifacts \
              --no-build \
              -p:TargetFramework=net8.0 \
              -p:PackageVersion=${{ env.VERSION }}

      # Pack .NET 10 version
      - name: Pack NLog.LiteDB5x (.NET 10)
        run: dotnet pack ./src/NLog.LiteDB5x/NLog.LiteDB5x.csproj \
              --configuration Release \
              --output ./artifacts \
              --no-build \
              -p:TargetFramework=net10.0 \
              -p:PackageVersion=${{ env.VERSION }}

      - name: Push NuGet package to nuget.org
        if: github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          echo "Publishing packages to nuget.org"
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
